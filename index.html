<!doctype html>
<html lang="en-IN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Folio</title>
<meta name="description" content="Personal tracker for stocks and mutual funds, with paper trading. Data stays in this browser.">
<meta name="theme-color" content="#EEF1F4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="anek-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Apply the saved theme before first paint so the screen doesn't flash.
  (function () {
    var t = 'system';
    try { t = JSON.parse(localStorage.getItem('folio:v1') || '{}').theme || 'system'; } catch (e) {}
    if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0D1520' : '#EEF1F4');
  })();
</script>
<style>
@font-face{font-family:"Anek";src:url(anek-latin.woff2) format("woff2");font-weight:100 800;font-stretch:75% 125%;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Anek";src:url(anek-rupee.woff2) format("woff2");font-weight:100 800;font-stretch:75% 125%;font-display:swap;unicode-range:U+20B9}

/* ---------- Colour tokens ---------- */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F2F5F8; --ink:#142233; --muted:#5A6B7E;
  --rule:#DCE2E9; --rule-strong:#AEBBCA;
  --accent:#1F4FA3; --on-accent:#FFFFFF; --accent-soft:#D9E3F4;
  --gain:#0E7A4E; --loss:#BF3A2E; --warn:#8A5A00;
  --scrim:rgba(14,22,34,.42); --lift:0 12px 32px rgba(14,22,34,.16);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0D1520; --surface:#142030; --surface-2:#1B2A3D; --ink:#E4EBF3; --muted:#8FA1B6;
  --rule:#22334A; --rule-strong:#3D526D;
  --accent:#8AB0FF; --on-accent:#0D1520; --accent-soft:#22355A;
  --gain:#43C98A; --loss:#FF7B6E; --warn:#F0BE5E;
  --scrim:rgba(0,0,0,.55); --lift:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.42 "Anek",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gain{color:var(--gain)}
.loss{color:var(--loss)}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:2px;height:58px;padding:0 6px 0 10px}
.grow{flex:1}
.pf-btn{display:flex;align-items:center;gap:8px;min-width:0;padding:8px 6px;border:0;border-radius:10px;background:none;font-size:19px;font-weight:640}
.pf-btn .pf-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.pf-btn svg{width:18px;height:18px;color:var(--muted)}
.icon{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--muted)}
.icon:active{background:var(--surface-2)}
.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{font-size:12px;font-weight:600;color:var(--accent);border:1.5px dashed currentColor;border-radius:6px;padding:0 6px;line-height:1.5;white-space:nowrap}
.banner{margin:8px 16px;padding:10px 14px;border-radius:12px;background:var(--surface);color:var(--loss);font-size:14px}

/* ---------- Overview ---------- */
.hero{margin:2px 16px 18px}
.hero.paper{margin:2px 12px 18px;padding:14px 14px 8px;border:1.5px dashed var(--rule-strong);border-radius:18px}
.lbl{margin:0;color:var(--muted);font-size:14.5px}
.big{margin:0 0 14px;font-size:clamp(36px,11.5vw,50px);font-weight:620;font-stretch:78%;line-height:1.08;letter-spacing:-.01em;white-space:nowrap}
.big .cur{font-size:.55em;font-weight:500;color:var(--muted);margin-right:.1em;vertical-align:.4em}
.big .dec{font-size:.5em;font-weight:500;color:var(--muted)}
.kvs{margin:0;display:grid;gap:8px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kv dt{color:var(--muted);font-size:15px}
.kv dd{margin:0;font-size:16px;font-weight:580;text-align:right}
.kv dd small{font-size:13.5px;font-weight:520;margin-left:8px}
.kv.sep{border-top:1px solid var(--rule);padding-top:10px;margin-top:2px}
.alloc{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:16px;background:var(--accent-soft)}
.alloc i{background:var(--accent)}
.alloc-key{display:flex;gap:18px;margin-top:7px;font-size:13px;color:var(--muted)}
.alloc-key b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--accent-soft)}
.alloc-key .k1{background:var(--accent)}
.status{display:flex;justify-content:space-between;align-items:center;gap:4px 10px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:10px 0;color:var(--accent);font-weight:620;font-size:14.5px}
.linkbtn.warn{color:var(--warn);padding:0;font-size:13.5px}

/* ---------- Holdings ---------- */
.tools{display:flex;align-items:center;gap:8px;margin:0 12px 8px;min-height:40px}
.chips{display:flex;gap:6px;overflow-x:auto}
.chip{height:34px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:999px;background:none;color:var(--muted);font-size:14px;font-weight:560;white-space:nowrap}
.chip span{margin-left:3px;opacity:.75}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sort{position:relative;margin-left:auto;display:flex;align-items:center}
.sort select{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--muted);font-size:14px;font-weight:560;padding:8px 22px 8px 6px;text-align:right}
.sort svg{position:absolute;right:2px;width:15px;height:15px;pointer-events:none;color:var(--muted)}
.list{margin:0 12px;background:var(--surface);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:baseline;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--rule);background:none;text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.nm{font-size:16.5px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;margin-top:1px;font-size:12.5px;font-weight:450;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.r{text-align:right;white-space:nowrap}
.pl{font-size:16px;font-weight:620}
.sub{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .gain{color:var(--gain)}
.row .loss{color:var(--loss)}
.stale{color:var(--warn)}
.end{height:112px}
.empty-note{margin:20px 16px;color:var(--muted);text-align:center}
.empty{margin:24px 16px;padding:24px 20px;background:var(--surface);border-radius:18px}
.empty.paper{background:none;border:1.5px dashed var(--rule-strong)}
.empty h1{margin:0 0 8px;font-size:25px;font-weight:650;font-stretch:90%;line-height:1.2}
.empty p{margin:0 0 18px;color:var(--muted)}

/* ---------- Floating button ---------- */
.fab{position:fixed;z-index:6;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;align-items:center;gap:6px;height:54px;padding:0 22px 0 16px;border:0;border-radius:27px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:650;box-shadow:var(--lift)}
.fab svg{stroke-width:2.2}

/* ---------- Bottom sheet ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .2s}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-width:560px;max-height:92vh;max-height:92dvh;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;padding:6px 18px calc(env(safe-area-inset-bottom) + 22px);background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--lift);transform:translateY(102%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s .24s}
.sheet.on{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:4px;margin:4px auto 6px;border-radius:2px;background:var(--rule-strong)}
.sheet .close{position:absolute;top:8px;right:8px}
.sheet h2{margin:8px 44px 4px 0;font-size:23px;font-weight:650;font-stretch:92%;line-height:1.2;outline:none}
.sheet h3{margin:24px 0 6px;font-size:16px;font-weight:650}
.muted{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.note{margin:8px 0;color:var(--muted);font-size:13.5px}
.err{margin:8px 0;color:var(--loss);font-size:14.5px}
.err:empty,.preview:empty,.note:empty{display:none}
.preview{margin:6px 0;color:var(--muted);font-size:14.5px}
.detail{margin:16px 0 8px}
.field{margin:12px 0;min-width:0}
.field label,.flabel,.lab{display:block;margin:0 0 6px;color:var(--muted);font-size:13.5px}
.input{width:100%;height:50px;padding:0 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface-2);color:var(--ink);font-size:17px}
.input::placeholder{color:var(--muted);opacity:.8}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.input.bad{border-color:var(--loss)}
.caps{text-transform:uppercase}
.caps::placeholder{text-transform:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inrow{display:flex;gap:8px}
.inrow .input{flex:1;min-width:0}
.seg{display:flex;gap:3px;margin:10px 0;padding:3px;border-radius:13px;background:var(--surface-2)}
.seg button{flex:1;height:42px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:15px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--rule-strong)}
.field .seg{margin:0}
.field .seg button{height:44px}
.btn{height:50px;padding:0 18px;border:0;border-radius:14px;font-size:16px;font-weight:640;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{height:44px;padding:0;background:none;color:var(--loss)}
.btn.block{display:block;width:100%;margin-top:12px}
.btn.small{height:34px;margin:6px 0 2px;padding:0 12px;border-radius:10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-top:16px}
.results{max-height:260px;overflow-y:auto;margin-top:6px;border-radius:12px}
.res{display:block;width:100%;margin:0 0 2px;padding:12px 14px;border:0;background:var(--surface-2);text-align:left;font-size:14.5px;line-height:1.3}
.res:active{background:var(--accent-soft)}
.bulk{margin-top:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.brow label{min-width:0;margin:0}
.brow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow small{display:block;color:var(--muted);font-size:12.5px}
.brow .input{height:44px;text-align:right}
.stick{position:sticky;bottom:0;padding-top:10px;background:var(--surface)}
.howto{margin:12px 0;padding:2px 14px;border-radius:14px;background:var(--surface-2)}
.howto summary{padding:12px 0;font-weight:620;cursor:pointer}
.howto ol{margin:0 0 6px;padding-left:20px}
.howto li{margin:0 0 12px;font-size:14.5px}
.howto .btn.ghost{background:var(--surface)}
.howto code{display:block;margin:6px 0 2px;padding:8px 10px;border-radius:8px;background:var(--surface);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;-webkit-user-select:all;user-select:all}
.issues{margin:8px 0;padding-left:18px}
.issues li{margin:0 0 8px}
.pflist{display:grid;gap:8px;margin-top:12px}
.pfrow{display:flex;align-items:center;gap:4px;padding:2px 4px 2px 0;border:1.5px solid transparent;border-radius:14px;background:var(--surface-2)}
.pfrow.on{border-color:var(--accent)}
.pfpick{flex:1;display:grid;gap:2px;min-width:0;padding:10px 14px;border:0;background:none;text-align:left}
.pfpick .nm{display:flex;align-items:center;gap:8px;font-size:16px}
.trades{margin:10px 0 0;padding:0;list-style:none}
.trades li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.trades small{display:block;color:var(--muted);font-size:12.5px}
.trades .buy{color:var(--accent)}
.trades .sell{color:var(--warn)}

/* ---------- Toast ---------- */
.toast{position:fixed;z-index:40;left:50%;top:calc(env(safe-area-inset-top) + 64px);max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14.5px;box-shadow:var(--lift);opacity:0;pointer-events:none;transform:translate(-50%,-10px);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <button class="pf-btn" id="pfBtn" type="button" aria-haspopup="dialog" aria-label="Switch portfolio"><span class="pf-name" id="pfName"></span><span class="tag" id="pfTag" hidden>Paper</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <span class="grow"></span>
    <button class="icon" id="refreshBtn" type="button" aria-label="Refresh prices"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5V9H15"/></svg></button>
    <button class="icon" id="themeBtn" type="button" aria-label="Switch theme"></button>
    <button class="icon" id="settingsBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
  </div>
</header>
<div class="wrap"><div class="banner" id="banner" role="alert" hidden>This browser is blocking storage, so changes will be lost when you close the app.</div></div>
<main class="wrap" id="main"></main>
<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="fabLabel">Add</span></button>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Folio: a personal portfolio tracker. Everything is stored in this
   browser's localStorage under one key. Nothing is sent anywhere except
   price look-ups (MFapi.in for mutual funds, your own Google Sheet for
   stocks), and those requests carry only scheme codes or the sheet ID.
   ===================================================================== */

const VERSION = '1.0';
const KEY = 'folio:v1';
const DAY = 864e5;
const STALE = 3 * DAY;                 // prices older than this are flagged
const AUTO_EVERY = 5 * 60e3;           // auto-refresh at most every 5 minutes
const MINUS = '−';
const BAR = { light: '#EEF1F4', dark: '#0D1520' };
const F_PRICE = '=MAP(A2:A300,LAMBDA(s,IF(s="",0,IFERROR(GOOGLEFINANCE(s,"price"),0))))';
const F_PREV = '=MAP(A2:A300,LAMBDA(s,IF(s="",0,IFERROR(GOOGLEFINANCE(s,"closeyest"),0))))';

const ICON = {
  sun: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  sliders: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
  x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  chev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ---------- Small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = n => Math.round(n * 100) / 100;
const r4 = n => Math.round(n * 1e4) / 1e4;
const num = v => { const s = String(v ?? '').replace(/[,\s₹]/g, ''); if (!s) return NaN; const n = Number(s); return isFinite(n) ? n : NaN; };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);

/* ---------- Number formatting (Indian grouping) ---------- */
const NF = {};
const nf = (min, max) => NF[min + '-' + max] || (NF[min + '-' + max] = new Intl.NumberFormat('en-IN', { minimumFractionDigits: min, maximumFractionDigits: max }));
const amt = n => nf(2, 2).format(Math.abs(r2(n)));
const sAmt = n => { n = r2(n); return (n > 0 ? '+' : n < 0 ? MINUS : '') + nf(2, 2).format(Math.abs(n)); };
const sPct = n => { if (n == null || !isFinite(n)) return '–'; n = r2(n); return (n > 0 ? '+' : n < 0 ? MINUS : '') + Math.abs(n).toFixed(2) + '%'; };
const tone = n => { if (n == null) return ''; n = r2(n); return n > 0 ? 'gain' : n < 0 ? 'loss' : ''; };
const px = (n, type) => (type === 'mf' ? nf(2, 4) : nf(2, 2)).format(n);
const qty = n => nf(0, 4).format(n);

/* ---------- Dates ---------- */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const sameDay = (a, b) => { const x = new Date(a), y = new Date(b); return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate(); };
const hm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const dmon = t => { const d = new Date(t); return d.getDate() + ' ' + MON[d.getMonth()]; };
const when = t => !t ? 'never' : sameDay(t, Date.now()) ? 'today ' + hm(t) : sameDay(t, Date.now() - DAY) ? 'yesterday ' + hm(t) : dmon(t) + ' ' + hm(t);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseDMY = s => { const m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec(String(s || '').trim()); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };

/* =====================================================================
   State
   holdings: { id, pf, key, type:'stock'|'mf', name, qty, avg, added }
   key:      'NSE:RELIANCE' | 'BSE:500325' | 'MF:122639' | 'MFM:<name>'
   prices:   key -> { ltp, prev, at, src:'sheet'|'mfapi'|'manual'|'entry', asOf }
   ===================================================================== */
function defaults() {
  return {
    v: 1, theme: 'system', sort: 'value', filter: 'all', activePf: 'real',
    portfolios: [
      { id: 'real', name: 'My holdings', paper: false },
      { id: 'paper', name: 'Paper trading', paper: true, cash: 1000000, deposited: 1000000 }
    ],
    holdings: [], trades: [], prices: {},
    sheetUrl: '', lastRefresh: 0, status: null, lastBackup: 0
  };
}
function migrate(s) {
  const o = Object.assign(defaults(), s && typeof s === 'object' ? s : {});
  if (!Array.isArray(o.portfolios) || !o.portfolios.length) o.portfolios = defaults().portfolios;
  if (!Array.isArray(o.holdings)) o.holdings = [];
  if (!Array.isArray(o.trades)) o.trades = [];
  if (!o.prices || typeof o.prices !== 'object') o.prices = {};
  o.portfolios.forEach(p => { if (p.paper) { p.cash = +p.cash || 0; p.deposited = +p.deposited || 0; } });
  o.holdings = o.holdings.filter(h => h && h.key && h.qty > 0 && h.avg > 0);
  if (!o.portfolios.some(p => p.id === o.activePf)) o.activePf = o.portfolios[0].id;
  if (!SORTS[o.sort]) o.sort = 'value';
  if (!['all', 'stock', 'mf'].includes(o.filter)) o.filter = 'all';
  return o;
}
let storageOK = true;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; return defaults(); }
  if (!raw) return defaults();
  try { return migrate(JSON.parse(raw)); }
  catch (e) {   // keep a copy of unreadable data instead of overwriting it
    try { localStorage.setItem(KEY + ':unreadable:' + Date.now(), raw); } catch (_) {}
    return defaults();
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; }
  $('#banner').hidden = storageOK;
}

/* ---------- Sorting ---------- */
const nz = x => (x == null || !isFinite(x)) ? -1e15 : x;
const SORTS = {
  value: ['By current value', (a, b) => b.c.value - a.c.value],
  pnl: ['By P&L', (a, b) => b.c.pnl - a.c.pnl],
  pnlPct: ['By P&L %', (a, b) => b.c.pnlPct - a.c.pnlPct],
  day: ["By today's change", (a, b) => nz(b.c.chgPct) - nz(a.c.chgPct)],
  invested: ['By invested', (a, b) => b.c.invested - a.c.invested],
  name: ['By name', (a, b) => a.h.name.localeCompare(b.h.name)]
};

let S = load();

/* ---------- Portfolio and instrument helpers ---------- */
const activePf = () => S.portfolios.find(p => p.id === S.activePf) || S.portfolios[0];
const pfById = id => S.portfolios.find(p => p.id === id);
const holdingsOf = id => S.holdings.filter(h => h.pf === id);
const splitKey = k => { const i = k.indexOf(':'); return [k.slice(0, i), k.slice(i + 1)]; };
const isStockKey = k => /^(NSE|BSE):/.test(k);
const gfSym = k => { const [ex, s] = splitKey(k); return ex === 'NSE' ? 'NSE:' + s : ex === 'BSE' ? 'BOM:' + s : ''; };

// Mutual fund names are long: "Fund Name - Direct Plan - Growth" -> title + plan tag.
function nameParts(h) {
  if (h.type !== 'mf') return { t: h.name, tag: '' };
  const parts = h.name.split(/\s+-\s+/);
  if (parts.length < 2) return { t: h.name, tag: '' };
  return { t: parts[0], tag: parts.slice(1).join(' ').replace(/\b(plan|option)\b/gi, '').replace(/\s{2,}/g, ' ').trim() };
}
function instrLine(h) {
  const [ex, s] = splitKey(h.key);
  if (ex === 'NSE' || ex === 'BSE') return (h.name !== s ? s + ' on ' : '') + ex;
  if (ex === 'MF') return 'Scheme code ' + s;
  return 'Prices entered by you';
}

/* ---------- Prices ---------- */
// For manual updates, the last price from an earlier day becomes "previous close".
function setPrice(key, ltp, src, extra = {}) {
  const old = S.prices[key], now = Date.now();
  let prev = extra.prev;
  if (prev === undefined) prev = old && old.ltp > 0 ? (sameDay(old.at, now) ? old.prev : old.ltp) : null;
  S.prices[key] = { ltp, prev: prev > 0 ? prev : null, at: now, src, asOf: extra.asOf || null };
}

/* ---------- Calculations ---------- */
function calc(h) {
  const p = pfById(h.pf), pr = S.prices[h.key];
  const ltp = pr && pr.ltp > 0 ? pr.ltp : h.avg;
  const invested = h.qty * h.avg, value = h.qty * ltp, pnl = value - invested;
  const ref = pr && pr.prev > 0 ? pr.prev : null;                  // previous close
  const chgPct = ref ? (ltp - ref) / ref * 100 : null;
  // Day's P&L counts a paper buy made today from its buy price, not yesterday's close.
  const base = p && p.paper && h.added && sameDay(h.added, Date.now()) ? h.avg : ref;
  return {
    pr, ltp, invested, value, pnl, pnlPct: invested > 0 ? pnl / invested * 100 : 0,
    chgPct, base, day: base ? (ltp - base) * h.qty : null, dayPct: base ? (ltp - base) / base * 100 : null,
    stale: !!pr && Date.now() - pr.at > STALE
  };
}
function summarize(list) {
  let inv = 0, val = 0, day = 0, baseVal = 0, hasDay = false;
  for (const h of list) {
    const c = calc(h);
    inv += c.invested; val += c.value;
    if (c.day != null) { day += c.day; baseVal += c.base * h.qty; hasDay = true; }
  }
  return { inv, val, pnl: val - inv, pnlPct: inv > 0 ? (val - inv) / inv * 100 : 0, day: hasDay ? day : null, dayPct: hasDay && baseVal > 0 ? day / baseVal * 100 : null };
}

/* ---------- Trades ---------- */
function doBuy(p, o) {
  const now = Date.now();
  let h = S.holdings.find(x => x.pf === p.id && x.key === o.key);
  if (h) {
    const nq = h.qty + o.qty;
    h.avg = (h.qty * h.avg + o.qty * o.price) / nq;
    h.qty = nq;
  } else {
    h = { id: uid(), pf: p.id, key: o.key, type: o.type, name: o.name, qty: o.qty, avg: o.price, added: now };
    S.holdings.push(h);
  }
  if (p.paper) p.cash = r2(p.cash - o.qty * o.price);
  S.trades.push({ id: uid(), pf: p.id, key: o.key, name: h.name, type: o.type, side: 'BUY', qty: o.qty, price: o.price, at: now });
  if (o.nav) setPrice(o.key, o.nav.ltp, 'mfapi', { prev: o.nav.prev, asOf: o.nav.date });
  else if (o.ltp > 0) setPrice(o.key, o.ltp, 'manual');
  else if (!S.prices[o.key]) S.prices[o.key] = { ltp: o.price, prev: null, at: now, src: 'entry', asOf: null };
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  return h;
}
function doSell(h, q, price) {
  const p = pfById(h.pf);
  const pnl = (price - h.avg) * q;
  h.qty -= q;
  if (h.qty <= 1e-9) S.holdings = S.holdings.filter(x => x !== h);
  if (p.paper) p.cash = r2(p.cash + q * price);
  S.trades.push({ id: uid(), pf: p.id, key: h.key, name: h.name, type: h.type, side: 'SELL', qty: q, price, pnl, at: Date.now() });
}

/* =====================================================================
   Price sources
   ===================================================================== */
async function getText(url, ms = 15000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('server replied ' + r.status);
    return await r.text();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('timed out');
    if (e instanceof TypeError) throw new Error('could not connect');
    throw e;
  } finally { clearTimeout(t); }
}
const getJSON = async (url, ms) => JSON.parse(await getText(url, ms));

// Mutual fund NAV from MFapi.in (free, no key). Returns latest and previous NAV.
async function fetchMF(code) {
  const from = ymd(new Date(Date.now() - 20 * DAY)), to = ymd(new Date());
  let d = await getJSON(`https://api.mfapi.in/mf/${encodeURIComponent(code)}?startDate=${from}&endDate=${to}`);
  if (!d || !Array.isArray(d.data) || !d.data.length) d = await getJSON(`https://api.mfapi.in/mf/${encodeURIComponent(code)}/latest`);
  const rows = ((d && d.data) || []).map(r => ({ d: parseDMY(r.date), nav: parseFloat(r.nav) }))
    .filter(r => r.d && r.nav > 0).sort((a, b) => b.d - a.d);
  if (!rows.length) throw new Error('no NAV found');
  return { ltp: rows[0].nav, prev: rows[1] ? rows[1].nav : null, date: rows[0].d.getTime(), name: d.meta && d.meta.scheme_name };
}

// Stock prices from the user's own Google Sheet (GOOGLEFINANCE formulas), read as public JSON.
function sheetEndpoint(url) {
  const m = /\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/.exec(url || '');
  if (!m) return null;
  const g = /[#&?]gid=(\d+)/.exec(url);
  return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:json&headers=1${g ? '&gid=' + g[1] : ''}`;
}
async function fetchSheet(url) {
  const ep = sheetEndpoint(url);
  if (!ep) throw new Error('This is not a Google Sheets link. Copy it from Share in Google Sheets.');
  let text;
  try { text = await getText(ep + '&t=' + Date.now()); }
  catch (e) { throw new Error('Could not read the Google Sheet (' + e.message + '). Check that General access is set to Anyone with the link.'); }
  const i = text.indexOf('{'), j = text.lastIndexOf('}');
  let json;
  try { json = JSON.parse(text.slice(i, j + 1)); } catch (e) { throw new Error('The Google Sheet did not return data. Check that General access is set to Anyone with the link.'); }
  if (json.status === 'error') throw new Error('Google Sheets: ' + ((json.errors && json.errors[0] && (json.errors[0].detailed_message || json.errors[0].message)) || 'error'));
  const cellNum = c => !c || c.v == null ? null : typeof c.v === 'number' ? c.v : num(c.v);
  const map = new Map();
  for (const row of (json.table && json.table.rows) || []) {
    const c = row.c || [];
    const sym = c[0] && c[0].v != null ? String(c[0].v).toUpperCase().replace(/\s+/g, '') : '';
    if (sym) map.set(sym, { price: cellNum(c[1]), prev: cellNum(c[2]) });
  }
  return map;
}
const sheetLookup = (map, key) => map.get(gfSym(key)) || (key.startsWith('NSE:') ? map.get(key.slice(4)) : undefined);

async function pool(tasks, n) {
  let i = 0;
  const run = async () => { while (i < tasks.length) await tasks[i++](); };
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, run));
}

let refreshing = false;
function autoKeys() {
  const keys = [...new Set(S.holdings.map(h => h.key))];
  return { mf: keys.filter(k => k.startsWith('MF:')), st: S.sheetUrl ? keys.filter(isStockKey) : [] };
}
async function refreshPrices(manual) {
  if (refreshing) return;
  const src = autoKeys();
  if (!src.mf.length && !src.st.length) {
    if (manual) toast(S.holdings.length ? 'No automatic prices set up. Use Update prices, or link a Google Sheet in Settings.' : 'Add a holding first.');
    return;
  }
  if (!navigator.onLine) { if (manual) toast('You are offline. Showing saved prices.'); return; }
  refreshing = true; setSpin(true);
  const issues = []; let updated = 0;
  await pool(src.mf.map(k => async () => {
    try { const r = await fetchMF(k.slice(3)); setPrice(k, r.ltp, 'mfapi', { prev: r.prev, asOf: r.date }); updated++; }
    catch (e) { issues.push({ key: k, msg: 'NAV not fetched: ' + e.message + '.' }); }
  }), 4);
  if (src.st.length) {
    try {
      const map = await fetchSheet(S.sheetUrl);
      for (const k of src.st) {
        const r = sheetLookup(map, k);
        if (r && r.price > 0) { setPrice(k, r.price, 'sheet', { prev: r.prev > 0 ? r.prev : null }); updated++; }
        else issues.push({ key: k, msg: r ? `The sheet shows no price for ${gfSym(k)}. Check the symbol in column A.` : `${gfSym(k)} is not in your Google Sheet. Add it to column A.` });
      }
    } catch (e) { issues.push({ key: null, msg: e.message }); }
  }
  S.lastRefresh = Date.now();
  S.status = { at: S.lastRefresh, updated, issues };
  save(); render(); setSpin(false); refreshing = false;
  if (manual) toast(issues.length ? `Updated ${updated}. ${issues.length} not updated.` : `Updated ${updated} price${updated === 1 ? '' : 's'}`);
}
function maybeAuto() { if (Date.now() - (S.lastRefresh || 0) > AUTO_EVERY) refreshPrices(false); }
function setSpin(on) { const b = $('#refreshBtn'); b.classList.toggle('spin', on); b.setAttribute('aria-busy', on); }

/* =====================================================================
   Main screen
   ===================================================================== */
const LBL = { all: 'Current value', stock: 'Current value of stocks', mf: 'Current value of mutual funds' };
const kv = (k, v, cls = '') => `<div class="kv ${cls}"><dt>${k}</dt><dd>${v}</dd></div>`;

function render() {
  const p = activePf();
  const all = holdingsOf(p.id);
  const counts = { all: all.length, stock: all.filter(h => h.type === 'stock').length, mf: all.filter(h => h.type === 'mf').length };
  if (S.filter !== 'all' && !(counts.stock && counts.mf)) S.filter = 'all';
  const list = S.filter === 'all' ? all : all.filter(h => h.type === S.filter);
  $('#pfName').textContent = p.name;
  $('#pfTag').hidden = !p.paper;
  $('#fabLabel').textContent = p.paper ? 'Buy' : 'Add';
  $('#main').innerHTML = all.length
    ? heroHTML(p, summarize(list), all) + toolbarHTML(counts) + listHTML(list) + '<div class="end"></div>'
    : emptyHTML(p);
}

function heroHTML(p, s, all) {
  const [int, dec] = amt(s.val).split('.');
  let rows = kv('Invested', '₹' + amt(s.inv))
    + kv('Total P&amp;L', `<span class="${tone(s.pnl)}">${sAmt(s.pnl)}<small>${sPct(s.pnlPct)}</small></span>`)
    + kv("Day's P&amp;L", s.day == null ? '–' : `<span class="${tone(s.day)}">${sAmt(s.day)}<small>${sPct(s.dayPct)}</small></span>`);
  if (p.paper) {
    const worth = p.cash + summarize(all).val, gain = worth - p.deposited;
    rows += kv('Funds available', '₹' + amt(p.cash), 'sep')
      + kv('Net worth', `₹${amt(worth)}<small class="${tone(gain)}">${sPct(p.deposited > 0 ? gain / p.deposited * 100 : 0)}</small>`);
  }
  return `<section class="hero${p.paper ? ' paper' : ''}" aria-label="Overview">
    <p class="lbl">${LBL[S.filter]}</p>
    <p class="big"><span class="cur">₹</span>${int}<span class="dec">.${dec}</span></p>
    <dl class="kvs">${rows}</dl>
    ${allocHTML(all)}${statusHTML(all)}
  </section>`;
}

function allocHTML(all) {
  if (S.filter !== 'all') return '';
  let st = 0, mf = 0;
  for (const h of all) { const v = calc(h).value; if (h.type === 'mf') mf += v; else st += v; }
  if (!st || !mf) return '';
  const a = Math.round(st / (st + mf) * 100);
  return `<div class="alloc" role="img" aria-label="Stocks ${a}%, mutual funds ${100 - a}%"><i style="width:${st / (st + mf) * 100}%"></i></div>
    <div class="alloc-key" aria-hidden="true"><span><b class="k1"></b>Stocks ${a}%</span><span><b></b>Mutual funds ${100 - a}%</span></div>`;
}

// Refresh problems that concern the active portfolio.
function liveIssues() {
  const st = S.status; if (!st || !st.issues) return [];
  const keys = new Set(holdingsOf(S.activePf).map(h => h.key));
  const hasStocks = [...keys].some(isStockKey);
  return st.issues.filter(i => i.key ? keys.has(i.key) : hasStocks);
}
function statusHTML(all) {
  const keys = [...new Set(all.map(h => h.key))];
  const set = keys.map(k => S.prices[k]).filter(pr => pr && pr.src !== 'entry');
  const atBuy = keys.filter(k => (S.prices[k] || {}).src === 'entry').length;
  let txt = 'Add today\u2019s prices to see your P&amp;L';
  if (set.length) {
    const ats = set.map(pr => pr.at);
    txt = 'Prices updated ' + when(Math.max(...ats)) + (Date.now() - Math.min(...ats) > STALE ? ', some are older' : '');
  }
  const links = [], n = liveIssues().length;
  if (atBuy && set.length) links.push(`<button class="linkbtn warn" type="button" data-act="bulk">${atBuy} at buy price</button>`);
  if (n) links.push(`<button class="linkbtn warn" type="button" data-act="issues">${n} not updated</button>`);
  return `<div class="status"><span>${txt}${links.length ? '. ' + links.join(', ') : ''}</span>
    <button class="linkbtn" type="button" data-act="bulk">Update prices</button></div>`;
}

function toolbarHTML(c) {
  const chip = (f, label) => `<button class="chip" type="button" data-filter="${f}" aria-pressed="${S.filter === f}">${label}<span>${c[f]}</span></button>`;
  const chips = c.stock && c.mf ? chip('all', 'All') + chip('stock', 'Stocks') + chip('mf', 'Funds') : '';
  const opts = Object.entries(SORTS).map(([k, v]) => `<option value="${k}"${S.sort === k ? ' selected' : ''}>${esc(v[0])}</option>`).join('');
  return `<div class="tools"><div class="chips">${chips}</div>
    <label class="sort"><span class="vh">Sort holdings</span><select id="sortSel">${opts}</select>${ICON.chev}</label></div>`;
}

function listHTML(list) {
  const rows = list.map(h => ({ h, c: calc(h) })).sort((SORTS[S.sort] || SORTS.value)[1]);
  return `<div class="list">${rows.map(r => rowHTML(r.h, r.c)).join('')}</div>`;
}

function rowHTML(h, c) {
  const n = nameParts(h);
  const chg = c.stale ? `<span class="stale">${dmon(c.pr.at)}</span>` : c.chgPct != null ? `<span class="${tone(c.chgPct)}">${sPct(c.chgPct)}</span>` : '';
  return `<button class="row" type="button" data-id="${h.id}">
    <span class="nm">${esc(n.t)}${n.tag ? `<small>${esc(n.tag)}</small>` : ''}</span>
    <span class="r pl ${tone(c.pnl)}">${sAmt(c.pnl)}</span>
    <span class="sub">${qty(h.qty)} × ${px(h.avg, h.type)}</span>
    <span class="sub r ${tone(c.pnl)}">${sPct(c.pnlPct)}</span>
    <span class="sub">${h.type === 'mf' ? 'NAV' : 'LTP'} ${px(c.ltp, h.type)} ${chg}</span>
    <span class="sub r">₹${amt(c.value)}</span>
  </button>`;
}

function emptyHTML(p) {
  return `<section class="empty${p.paper ? ' paper' : ''}">
    <h1>${p.paper ? 'Start paper trading' : 'Add your first holding'}</h1>
    <p>${p.paper
      ? `You have ₹${amt(p.cash)} of virtual funds. Buy stocks or mutual funds at today's price and follow them like real holdings.`

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2800);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}

    </dl>
    <p class="note">${esc(src)}</p>
    <form id="priceForm" novalidate autocomplete="off">
      <div class="field"><label for="pIn">${mf ? "Today's NAV" : "Today's price"}</label>
      <div class="inrow"><input id="pIn" class="input" inputmode="decimal" placeholder="${px(c.ltp, h.type)}" enterkeyhint="done"><button class="btn ghost">Save price</button></div></div>
    </form>
    <div class="actions">
      <button class="btn primary" type="button" id="dBuy">Buy more</button>
      <button class="btn ghost" type="button" id="dSell">Sell</button>
      <button class="btn ghost" type="button" id="dEdit">Edit</button>
    </div>`, sh => {
    $('#priceForm', sh).onsubmit = e => {
      e.preventDefault();
      const v = num($('#pIn', sh).value);
      if (!(v > 0)) { toast('Enter a price greater than 0.'); return; }
      setPrice(h.key, v, 'manual'); save(); render(); openDetail(h.id); toast('Price saved');
    };
    $('#dBuy', sh).onclick = () => openTrade(h.id, 'BUY');
    $('#dSell', sh).onclick = () => openTrade(h.id, 'SELL');
    $('#dEdit', sh).onclick = () => openEdit(h.id);
  });
}

/* ---------- Buy more / Sell ---------- */
function openTrade(id, side) {
  const h = S.holdings.find(x => x.id === id); if (!h) return;
  const p = pfById(h.pf), c = calc(h), mf = h.type === 'mf', buy = side === 'BUY', n = nameParts(h);
  openSheet(buy ? 'Buy more' : 'Sell', `
    <h2 tabindex="-1">${buy ? 'Buy more' : 'Sell'} ${esc(n.t)}</h2>
    <p class="muted">You hold ${qty(h.qty)} at avg. ₹${px(h.avg, h.type)}.${p.paper ? ` Funds available ₹${amt(p.cash)}.` : ''}</p>
    <form id="tForm" novalidate autocomplete="off">
      <div class="grid2">
        <div class="field"><label for="tQty">${mf ? 'Units' : 'Quantity'}</label><input id="tQty" class="input" inputmode="decimal" value="${buy ? '' : r4(h.qty)}" enterkeyhint="next" data-autofocus></div>
        <div class="field"><label for="tPx">${mf ? 'NAV' : 'Price'}</label><input id="tPx" class="input" inputmode="decimal" value="${r4(c.ltp)}" enterkeyhint="done"></div>
      </div>
      <p class="preview" id="tPrev" aria-live="polite"></p>
      <p class="err" id="tErr" role="alert"></p>
      <button class="btn primary block">${buy ? 'Buy' : 'Sell'}</button>
    </form>`, sh => {
    const qIn = $('#tQty', sh), pIn = $('#tPx', sh), prev = $('#tPrev', sh), err = $('#tErr', sh);
    const upd = () => {
      const Q = num(qIn.value), P = num(pIn.value);
      if (!(Q > 0 && P > 0)) { prev.textContent = ''; return; }
      if (buy) prev.innerHTML = `Cost ₹${amt(Q * P)}. New avg. ₹${px((h.qty * h.avg + Q * P) / (h.qty + Q), h.type)}.${p.paper ? ` Funds left ₹${amt(p.cash - Q * P)}.` : ''}`;
      else { const pl = (P - h.avg) * Math.min(Q, h.qty); prev.innerHTML = `You get ₹${amt(Q * P)}. Realised P&amp;L <span class="${tone(pl)}">${sAmt(pl)}</span>.`; }
    };
    qIn.oninput = pIn.oninput = upd; upd();
    $('#tForm', sh).onsubmit = e => {
      e.preventDefault();
      let Q = num(qIn.value); const P = num(pIn.value);
      if (!(Q > 0)) { err.textContent = 'Enter a quantity greater than 0.'; return; }
      if (!(P > 0)) { err.textContent = 'Enter a price greater than 0.'; return; }
      if (buy) {
        if (p.paper && Q * P > p.cash + 0.005) { err.textContent = `Not enough funds. Available ₹${amt(p.cash)}.`; return; }
        doBuy(p, { key: h.key, type: h.type, name: h.name, qty: Q, price: P });
      } else {
        if (Math.abs(Q - h.qty) < 1e-6) Q = h.qty;
        if (Q > h.qty) { err.textContent = `You hold only ${qty(h.qty)}.`; return; }
        doSell(h, Q, P);
      }
      save(); render(); closeSheet(); toast(buy ? 'Bought' : 'Sold');
    };
  });
}

/* ---------- Edit holding ---------- */

  openSheet('Edit holding', `

    <form id="eForm" novalidate autocomplete="off">
      <div class="field"><label for="eName">Name</label><input id="eName" class="input" value="${esc(h.name)}" maxlength="120"></div>
      <div class="grid2">
        <div class="field"><label for="eQty">${mf ? 'Units' : 'Quantity'}</label><input id="eQty" class="input" inputmode="decimal" value="${r4(h.qty)}"></div>
        <div class="field"><label for="eAvg">${mf ? 'Avg. NAV' : 'Avg. price'}</label><input id="eAvg" class="input" inputmode="decimal" value="${r4(h.avg)}"></div>
      </div>
      <p class="err" id="eErr" role="alert"></p>

      <button class="btn danger block" type="button" id="eDel">Remove holding</button>

/* ---------- Add holding / Buy ---------- */
function openAdd() {
  const p = activePf();
  const st = { type: S.filter === 'mf' ? 'mf' : 'stock', ex: 'NSE', mf: null, nav: null };
  openSheet(p.paper ? 'Buy' : 'Add holding', `
    <h2 tabindex="-1">${p.paper ? 'Buy' : 'Add holding'}</h2>
    ${p.paper ? `<p class="muted">Paper trade. Funds available ₹${amt(p.cash)}.</p>` : ''}
    <div class="seg" id="aType" role="group" aria-label="Holding type"><button type="button" data-v="stock">Stock or ETF</button><button type="button" data-v="mf">Mutual fund</button></div>
    <form id="aForm" novalidate autocomplete="off">
      <div id="aStock">
        <div class="grid2">
          <div class="field"><label for="aSym">Symbol</label><input id="aSym" class="input caps" placeholder="RELIANCE" autocapitalize="characters" spellcheck="false" enterkeyhint="next"></div>
          <div class="field"><span class="flabel" id="aExL">Exchange</span><div class="seg" id="aEx" role="group" aria-labelledby="aExL"><button type="button" data-v="NSE" aria-pressed="true">NSE</button><button type="button" data-v="BSE" aria-pressed="false">BSE</button></div></div>
        </div>
        <div class="field" id="aNmF" hidden><label for="aNm">Name (optional)</label><input id="aNm" class="input" placeholder="Shown instead of the BSE code"></div>
      </div>
      <div id="aMf" hidden>
        <div class="field"><label for="aFund">Fund</label><input id="aFund" class="input" placeholder="Search, e.g. parag parikh flexi" spellcheck="false" enterkeyhint="search"></div>
        <div class="results" id="aRes"></div>
        <p class="note" id="aPick"></p>
      </div>
      <div class="grid2">
        <div class="field"><label for="aQty" id="aQtyL">Quantity</label><input id="aQty" class="input" inputmode="decimal" enterkeyhint="next"></div>
        <div class="field"><label for="aPx" id="aPxL">Price</label><input id="aPx" class="input" inputmode="decimal" enterkeyhint="next"></div>
      </div>
      ${p.paper ? '' : `<div class="field"><label for="aLtp" id="aLtpL">Today's price (optional)</label><input id="aLtp" class="input" inputmode="decimal" placeholder="Leave blank to use the buy price" enterkeyhint="done"></div>`}
      <p class="preview" id="aPrev" aria-live="polite"></p>
      <p class="err" id="aErr" role="alert"></p>
      <button class="btn primary block">${p.paper ? 'Buy' : 'Add holding'}</button>
    </form>`, sh => {
    const q = id => $('#' + id, sh);
    const err = m => { q('aErr').textContent = m; };
    const symKey = () => { const s = q('aSym').value.trim().toUpperCase().replace(/\s+/g, ''); return s ? st.ex + ':' + s : ''; };
    const curKey = () => st.type === 'stock' ? symKey() : st.mf ? 'MF:' + st.mf.code : '';

    function upd() {
      const Q = num(q('aQty').value), P = num(q('aPx').value), key = curKey();
      const have = key && S.holdings.find(x => x.pf === p.id && x.key === key);
      const parts = [];
      if (have) parts.push(`You already hold ${qty(have.qty)} at avg. ₹${px(have.avg, have.type)}. This adds to it.`);
      if (Q > 0 && P > 0) parts.push(`Cost ₹${amt(Q * P)}.` + (p.paper ? ` Funds left ₹${amt(p.cash - Q * P)}.` : ''));
      q('aPrev').textContent = parts.join(' ');
    }
    function knownPrice() {   // prefill the price if this instrument is already tracked
      const key = curKey(), pr = key && S.prices[key];
      if (!pr) return;
      if (p.paper) { if (!q('aPx').value) q('aPx').value = r4(pr.ltp); }
      else q('aLtp').placeholder = 'Last saved ' + px(pr.ltp, st.type);
    }
    function setType(t) {
      st.type = t;
      $$('#aType button', sh).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === t));
      q('aStock').hidden = t !== 'stock'; q('aMf').hidden = t !== 'mf';
      q('aQtyL').textContent = t === 'mf' ? 'Units' : 'Quantity';
      q('aPxL').textContent = p.paper ? (t === 'mf' ? 'Buy NAV' : 'Buy price') : (t === 'mf' ? 'Avg. NAV' : 'Avg. buy price');
      if (q('aLtpL')) q('aLtpL').textContent = t === 'mf' ? "Today's NAV (optional)" : "Today's price (optional)";
      err(''); upd();
    }
    q('aType').onclick = e => { const b = e.target.closest('button'); if (b) setType(b.dataset.v); };
    q('aEx').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      st.ex = b.dataset.v;
      $$('#aEx button', sh).forEach(x => x.setAttribute('aria-pressed', x === b));
      q('aNmF').hidden = st.ex !== 'BSE';
      q('aSym').placeholder = st.ex === 'BSE' ? '500325' : 'RELIANCE';
      knownPrice(); upd();
    };
    q('aSym').addEventListener('input', () => { knownPrice(); upd(); });
    q('aQty').addEventListener('input', upd);
    q('aPx').addEventListener('input', upd);

    // Mutual fund search (MFapi.in)
    let timer, seq = 0;
    q('aFund').addEventListener('input', () => {
      st.mf = null; st.nav = null; q('aPick').textContent = ''; upd();
      clearTimeout(timer);
      const text = q('aFund').value.trim();
      if (text.length < 3) { q('aRes').innerHTML = ''; return; }
      timer = setTimeout(async () => {
        const my = ++seq;
        q('aRes').innerHTML = '<p class="note">Searching…</p>';
        try {
          const arr = await getJSON('https://api.mfapi.in/mf/search?q=' + encodeURIComponent(text));
          if (my !== seq) return;
          const items = (Array.isArray(arr) ? arr : []).slice(0, 40);
          q('aRes').innerHTML = items.length
            ? items.map(it => `<button type="button" class="res" data-code="${esc(it.schemeCode)}" data-name="${esc(it.schemeName)}">${esc(it.schemeName)}</button>`).join('')
            : '<p class="note">No matching funds. Try fewer words, or add it with the name as typed and enter prices yourself.</p>';
        } catch (e) {
          if (my !== seq) return;
          q('aRes').innerHTML = '<p class="note">Search is unavailable right now. You can add the fund with the name as typed and enter prices yourself.</p>';
        }
      }, 350);
    });
    q('aRes').onclick = async e => {
      const b = e.target.closest('.res'); if (!b) return;
      const pick = { code: b.dataset.code, name: b.dataset.name };
      st.mf = pick; st.nav = null;
      q('aFund').value = pick.name; q('aRes').innerHTML = '';
      q('aPick').textContent = 'Fetching NAV…';
      knownPrice(); upd();
      try {
        const r = await fetchMF(pick.code);
        if (st.mf !== pick) return;
        st.nav = r;
        q('aPick').textContent = `NAV ₹${px(r.ltp, 'mf')} on ${dmon(r.date)}. It will update automatically.`;
        if (p.paper) { if (!q('aPx').value) q('aPx').value = r4(r.ltp); } else q('aLtp').value = r4(r.ltp);
        upd();
      } catch (er) {
        if (st.mf === pick) q('aPick').textContent = 'Could not fetch the NAV now. Enter it yourself; it will update on the next refresh.';
      }
    };

    q('aForm').onsubmit = e => {
      e.preventDefault();
      let key, name;
      if (st.type === 'stock') {
        const sym = q('aSym').value.trim().toUpperCase().replace(/\s+/g, '');
        if (!sym) return err('Enter the stock symbol, for example RELIANCE.');
        if (!/^[A-Z0-9&._-]+$/.test(sym)) return err('Use the exchange symbol, for example M&M or BAJAJ-AUTO.');
        key = st.ex + ':' + sym;
        const existing = S.holdings.find(x => x.key === key);
        name = st.ex === 'BSE' && q('aNm').value.trim() ? q('aNm').value.trim() : existing ? existing.name : sym;
      } else {
        const nm = q('aFund').value.trim();
        if (!nm) return err('Search for the fund and pick it from the list, or type its name.');
        if (st.mf && st.mf.name === nm) { key = 'MF:' + st.mf.code; name = st.mf.name; }
        else { key = 'MFM:' + slug(nm); name = nm; }
      }
      const Q = num(q('aQty').value), P = num(q('aPx').value);
      const L = q('aLtp') && q('aLtp').value.trim() ? num(q('aLtp').value) : null;
      if (!(Q > 0)) return err(st.type === 'mf' ? 'Enter the number of units.' : 'Enter the quantity.');
      if (!(P > 0)) return err(p.paper ? 'Enter the buy price.' : 'Enter the average buy price.');
      if (L !== null && !(L > 0)) return err("Today's price must be a number greater than 0.");
      if (p.paper && Q * P > p.cash + 0.005) return err(`Not enough funds. Available ₹${amt(p.cash)}.`);
      const nav = st.nav && key === 'MF:' + st.mf.code && (L === null || Math.abs(L - r4(st.nav.ltp)) < 1e-9) ? st.nav : null;
      doBuy(p, { key, type: st.type, name, qty: Q, price: P, ltp: nav ? null : L, nav });
      save(); render(); closeSheet();
      const short = nameParts({ type: st.type, name }).t;
      toast(p.paper ? `Bought ${short}` : `Added ${short}`);
    };
    setType(st.type);
    setTimeout(() => (st.type === 'stock' ? q('aSym') : q('aFund')).focus(), 120);
  });
}

/* ---------- Update prices (all instruments, all portfolios) ---------- */
function openBulk() {
  const keys = [...new Set(S.holdings.map(h => h.key))];
  if (!keys.length) { toast('Add a holding first.'); return; }
  const items = keys.map(k => ({ k, h: S.holdings.find(h => h.key === k), pr: S.prices[k] }))
    .sort((a, b) => (a.h.type === b.h.type ? 0 : a.h.type === 'stock' ? -1 : 1) || nameParts(a.h).t.localeCompare(nameParts(b.h).t));
  openSheet('Update prices', `
    <h2 tabindex="-1">Update prices</h2>
    <p class="muted">Type today's prices. Rows left blank keep their price. Prices apply to all portfolios.</p>
    <form id="bForm" novalidate autocomplete="off">
      <div class="bulk">${items.map((it, i) => `
        <div class="brow">
          <label for="b${i}"><b>${esc(nameParts(it.h).t)}</b><small>${it.h.type === 'mf' ? 'NAV' : 'LTP'} ${px(it.pr ? it.pr.ltp : it.h.avg, it.h.type)}, ${when(it.pr && it.pr.at)}</small></label>
          <input id="b${i}" class="input" data-key="${esc(it.k)}" inputmode="decimal" enterkeyhint="${i === items.length - 1 ? 'done' : 'next'}" placeholder="${px(it.pr ? it.pr.ltp : it.h.avg, it.h.type)}">
        </div>`).join('')}</div>
      <p class="err" id="bErr" role="alert"></p>
      <div class="stick"><button class="btn primary block">Save prices</button></div>
    </form>`, sh => {
    const inputs = $$('.bulk input', sh);
    inputs.forEach((inp, i) => inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && i < inputs.length - 1) { e.preventDefault(); inputs[i + 1].focus(); }
    }));
    $('#bForm', sh).onsubmit = e => {
      e.preventDefault();
      const good = [], bad = [];
      inputs.forEach(inp => {
        inp.classList.remove('bad');
        if (!inp.value.trim()) return;
        const v = num(inp.value);
        (v > 0 ? good : bad).push([inp, v]);
      });
      if (bad.length) { bad.forEach(([inp]) => inp.classList.add('bad')); $('#bErr', sh).textContent = 'Fix the highlighted prices. Use numbers only, like 2450.50.'; return; }
      good.forEach(([inp, v]) => setPrice(inp.dataset.key, v, 'manual'));
      save(); render(); closeSheet();
      toast(good.length ? `Saved ${good.length} price${good.length === 1 ? '' : 's'}` : 'No prices changed');
    };
  });
}

  const p = pfById(id); if (!p) return;
  const trades = S.trades.filter(t => t.pf === id);
  const realised = trades.reduce((a, t) => a + (t.pnl || 0), 0);
  openSheet('Manage portfolio', `
    <h2 tabindex="-1">${esc(p.name)}</h2>
    <form id="mName" novalidate autocomplete="off"><div class="field"><label for="mNm">Name</label>
      <div class="inrow"><input id="mNm" class="input" maxlength="40" value="${esc(p.name)}"><button class="btn ghost">Rename</button></div></div></form>
    ${p.paper ? `
    <h3>Virtual funds</h3>
    <p class="muted">Available ₹${amt(p.cash)}. Added in total ₹${amt(p.deposited)}.</p>
    <form id="mFunds" novalidate autocomplete="off"><label for="mAmt" class="vh">Amount</label>
      <div class="inrow"><input id="mAmt" class="input" inputmode="decimal" placeholder="Amount"><button class="btn ghost" type="button" id="mAdd">Add</button><button class="btn ghost" type="button" id="mWd">Withdraw</button></div></form>` : ''}
    <h3>Trades</h3>
    <p class="muted">${trades.length} recorded. Realised P&amp;L <span class="${tone(realised)}">${sAmt(realised)}</span>.</p>
    <button class="btn ghost block" type="button" id="mTrades"${trades.length ? '' : ' disabled'}>View trades</button>
    ${p.paper ? `
    <h3>Start over</h3>
    <form id="mReset" novalidate autocomplete="off"><div class="field"><label for="mStart">Virtual funds to start with</label>
      <div class="inrow"><input id="mStart" class="input" inputmode="decimal" value="${r2(p.deposited) || 1000000}"><button class="btn ghost">Reset</button></div></div></form>
    <p class="note">Reset removes this portfolio's holdings and trades.</p>` : ''}
    ${S.portfolios.length > 1 ? '<button class="btn danger block" type="button" id="mDel">Delete this portfolio</button>' : ''}`, sh => {
    $('#mName', sh).onsubmit = e => {
      e.preventDefault();
      const v = $('#mNm', sh).value.trim(); if (!v) return;
      p.name = v; save(); render(); toast('Renamed'); openManage(id);
    };
    if (p.paper) {
      const move = dir => {
        const a = num($('#mAmt', sh).value);
        if (!(a > 0)) { toast('Enter an amount greater than 0.'); return; }
        if (dir < 0 && a > p.cash + 0.005) { toast(`You can withdraw up to ₹${amt(p.cash)}.`); return; }
        p.cash = r2(p.cash + dir * a); p.deposited = r2(p.deposited + dir * a);
        save(); render(); toast(dir > 0 ? 'Funds added' : 'Funds withdrawn'); openManage(id);
      };
      $('#mAdd', sh).onclick = () => move(1);
      $('#mWd', sh).onclick = () => move(-1);
      $('#mFunds', sh).onsubmit = e => { e.preventDefault(); move(1); };
      $('#mReset', sh).onsubmit = e => {
        e.preventDefault();
        const f = num($('#mStart', sh).value);
        if (!(f > 0)) { toast('Enter the virtual funds to start with.'); return; }
        if (!confirm(`Remove all holdings and trades in ${p.name} and start again with ₹${amt(f)}?`)) return;
        S.holdings = S.holdings.filter(h => h.pf !== id); S.trades = S.trades.filter(t => t.pf !== id);
        p.cash = f; p.deposited = f;
        save(); render(); closeSheet(); toast('Portfolio reset');
      };
    }
    $('#mTrades', sh).onclick = () => openTrades(id);
    const del = $('#mDel', sh);
    if (del) del.onclick = () => {
      if (!confirm(`Delete ${p.name} with its holdings and trades?`)) return;
      S.portfolios = S.portfolios.filter(x => x !== p);
      S.holdings = S.holdings.filter(h => h.pf !== id); S.trades = S.trades.filter(t => t.pf !== id);
      if (S.activePf === id) S.activePf = S.portfolios[0].id;
      save(); render(); closeSheet(); toast('Portfolio deleted');
    };
  });
}

function openTrades(id) {
  const p = pfById(id);
  const list = S.trades.filter(t => t.pf === id).sort((a, b) => b.at - a.at);
  const realised = list.reduce((a, t) => a + (t.pnl || 0), 0);
  openSheet('Trades', `
    <h2 tabindex="-1">Trades</h2>
    <p class="muted">${esc(p.name)}. Realised P&amp;L <span class="${tone(realised)}">${sAmt(realised)}</span>.</p>
    <ul class="trades">${list.map(t => `<li>
      <div><b class="${t.side === 'BUY' ? 'buy' : 'sell'}">${t.side === 'BUY' ? 'Buy' : 'Sell'}</b> ${esc(nameParts(t).t)}<small>${dmon(t.at)} ${new Date(t.at).getFullYear()}, ${hm(t.at)}</small></div>
      <div class="r">${qty(t.qty)} × ${px(t.price, t.type)}${t.side === 'SELL' ? `<small class="${tone(t.pnl)}">${sAmt(t.pnl)}</small>` : ''}</div>
    </li>`).join('')}</ul>`);
}

/* ---------- Settings ---------- */
function stockSymbols() { return [...new Set(S.holdings.filter(h => h.type === 'stock').map(h => gfSym(h.key)))]; }
function openSettings(toPrices) {
  const syms = stockSymbols();
  openSheet('Settings', `
    <h2 tabindex="-1">Settings</h2>
    <h3>Theme</h3>
    <div class="seg" id="sTheme" role="group" aria-label="Theme">${['system', 'light', 'dark'].map(t => `<button type="button" data-t="${t}" aria-pressed="${S.theme === t}">${{ system: 'Phone setting', light: 'Light', dark: 'Dark' }[t]}</button>`).join('')}</div>

    <h3 id="sPrices">Automatic prices</h3>
    <p class="muted">Mutual funds picked from search get their NAV automatically from MFapi.in, a free service.</p>
    <p class="muted">For stocks, link a Google Sheet that looks up prices with GOOGLEFINANCE. Without it, update stock prices yourself.</p>
    <form id="sForm" novalidate autocomplete="off">
      <label for="sUrl" class="vh">Google Sheet link</label>
      <input id="sUrl" class="input" type="url" inputmode="url" placeholder="Paste the Google Sheet link" value="${esc(S.sheetUrl)}">
      <div class="btnrow"><button class="btn primary">Save and test</button>${S.sheetUrl ? '<button class="btn ghost" type="button" id="sUnlink">Unlink</button>' : ''}</div>
      <p class="note" id="sMsg" aria-live="polite"></p>
    </form>
    <details class="howto"${S.sheetUrl ? '' : ' open'}>
      <summary>Set up the Google Sheet (one time)</summary>
      <ol>
        <li>Create a new Google Sheet. Type <b>Symbol</b>, <b>Price</b> and <b>Prev close</b> in A1, B1 and C1.</li>
        <li>Paste your stock symbols in column A, starting at A2. Use the form NSE:RELIANCE, or BOM:500325 for BSE codes.
          ${syms.length ? `<br><button class="btn ghost small" type="button" data-copy="syms">Copy my ${syms.length} symbol${syms.length === 1 ? '' : 's'}</button>` : ''}</li>
        <li>Paste this in B2:<code>${esc(F_PRICE)}</code><button class="btn ghost small" type="button" data-copy="f1">Copy</button></li>
        <li>Paste this in C2:<code>${esc(F_PREV)}</code><button class="btn ghost small" type="button" data-copy="f2">Copy</button></li>
        <li>Tap Share, set General access to <b>Anyone with the link</b> (Viewer), copy the link and paste it above.</li>
      </ol>
      <p class="note">Only the symbols go in the sheet. Quantities and buy prices stay on this phone. When you buy a new stock, add its symbol to column A. Google Finance prices can be delayed.</p>
    </details>

    <h3>Backup</h3>
    <p class="muted">Your data is saved in this browser only. Clearing Chrome's data for this site deletes it, so export a backup now and then. Last export: ${when(S.lastBackup)}.</p>
    <div class="btnrow"><button class="btn ghost" type="button" id="sExp">Export backup</button><button class="btn ghost" type="button" id="sImp">Import backup</button></div>
    <input type="file" id="sFile" accept="application/json,.json" hidden>

    <h3>Erase</h3>
    <button class="btn danger" type="button" id="sWipe">Erase all data on this phone</button>
    <p class="note">Folio ${VERSION}. Not connected to any broker; it shows only what you enter and the prices it looks up.</p>`, sh => {
    $('#sTheme', sh).onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      S.theme = b.dataset.t; save(); applyTheme();
      $$('#sTheme button', sh).forEach(x => x.setAttribute('aria-pressed', x === b));
    };
    const msg = $('#sMsg', sh);
    $('#sForm', sh).onsubmit = async e => {
      e.preventDefault();
      const url = $('#sUrl', sh).value.trim();
      if (!url) { S.sheetUrl = ''; save(); msg.textContent = 'Sheet unlinked.'; return; }
      if (!sheetEndpoint(url)) { msg.textContent = 'This is not a Google Sheets link. Copy it from Share in Google Sheets.'; return; }
      S.sheetUrl = url; save();
      msg.textContent = 'Testing…';
      try {
        const map = await fetchSheet(url);
        const mine = stockSymbols(), found = S.holdings.filter(h => h.type === 'stock' && (sheetLookup(map, h.key) || {}).price > 0);
        const foundKeys = new Set(found.map(h => h.key));
        msg.textContent = `Linked. The sheet has ${map.size} symbol${map.size === 1 ? '' : 's'}; prices found for ${foundKeys.size} of your ${mine.length} stock${mine.length === 1 ? '' : 's'}.`;
        S.lastRefresh = 0; refreshPrices(false);
      } catch (er) { msg.textContent = 'Saved, but the test failed. ' + er.message; }
    };
    const un = $('#sUnlink', sh);
    if (un) un.onclick = () => { S.sheetUrl = ''; save(); openSettings(true); toast('Sheet unlinked'); };
    $$('[data-copy]', sh).forEach(b => b.onclick = async () => {
      const text = { syms: stockSymbols().join('\n'), f1: F_PRICE, f2: F_PREV }[b.dataset.copy];
      toast(await copyText(text) ? 'Copied' : 'Could not copy. Select the text and copy it.');
    });
    $('#sExp', sh).onclick = () => {
      const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `folio-backup-${ymd(new Date())}.json`;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      S.lastBackup = Date.now(); save(); toast('Backup downloaded');
    };
    $('#sImp', sh).onclick = () => $('#sFile', sh).click();
    $('#sFile', sh).onchange = async e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      try {
        const obj = JSON.parse(await f.text());
        if (!obj || !Array.isArray(obj.portfolios) || !Array.isArray(obj.holdings)) throw new Error('bad');
        if (!confirm(`Replace everything on this phone with this backup (${obj.holdings.length} holdings)?`)) return;
        S = migrate(obj); save(); applyTheme(); render(); closeSheet(); toast('Backup restored');
      } catch (er) { toast('That file is not a Folio backup.'); }
      e.target.value = '';
    };
    $('#sWipe', sh).onclick = () => {
      if (!confirm('Erase all portfolios, holdings, trades and settings on this phone? Export a backup first if you might need it.')) return;
      S = defaults(); save(); applyTheme(); render(); closeSheet(); toast('All data erased');
    };
    if (toPrices) setTimeout(() => $('#sPrices', sh).scrollIntoView({ block: 'start' }), 60);
  });
}

/* ---------- Theme ---------- */
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : { matches: false };
const effTheme = () => S.theme === 'system' ? (mq.matches ? 'dark' : 'light') : S.theme;
function applyTheme() {
  const t = effTheme();
  document.documentElement.setAttribute('data-theme', t);
  $('meta[name="theme-color"]').setAttribute('content', BAR[t]);
  const b = $('#themeBtn');
  b.innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
  b.setAttribute('aria-label', t === 'dark' ? 'Use light theme' : 'Use dark theme');
}
if (mq.addEventListener) mq.addEventListener('change', () => { if (S.theme === 'system') applyTheme(); });

/* ---------- Wiring ---------- */
$('#pfBtn').onclick = openPortfolios;
$('#refreshBtn').onclick = () => refreshPrices(true);
$('#themeBtn').onclick = () => { S.theme = effTheme() === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
$('#settingsBtn').onclick = () => openSettings(false);
$('#fab').onclick = openAdd;
$('#scrim').onclick = () => closeSheet();
$('#sheet').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen) closeSheet(); });
$('#main').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (row) { openDetail(row.dataset.id); return; }
  const chip = e.target.closest('[data-filter]'); if (chip) { S.filter = chip.dataset.filter; save(); render(); return; }
  const act = e.target.closest('[data-act]'); if (!act) return;
  const fn = { add: openAdd, bulk: openBulk, issues: openIssues }[act.dataset.act];
  if (fn) fn();
});
$('#main').addEventListener('change', e => { if (e.target.id === 'sortSel') { S.sort = e.target.value; save(); render(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); maybeAuto(); } });
addEventListener('online', () => maybeAuto());

applyTheme();
save();
render();
maybeAuto();

// Offline support. Registered only on https (GitHub Pages) or localhost.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const reg = () => navigator.serviceWorker.register('sw.js').catch(() => {});
  if (document.readyState === 'complete') reg(); else addEventListener('load', reg);
}
})();
</script>
</body>
</html>
